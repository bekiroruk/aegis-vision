# Experimental local-video backend; mixed quality across scenes, not the default.
# Model/config defaults are not tuned on MOT data; see docs/model-quality.md.
version = 1

[pipeline]
mode = "video"

[detector]
backend = "yolo_onnx"
model = "../artifacts/models/yolov8n.onnx"
confidence_threshold = 0.35
nms_iou_threshold = 0.45
input_size = 640
max_detections = 300

[tracking]
backend = "kalman"
iou_threshold = 0.30
max_missed_frames = 20
low_confidence = 0.10
new_track_confidence = 0.50
mahalanobis_gate = 13.2767

[runtime]
device = "cpu"
precision = "fp32"
engine = "opencv-dnn"
