# Test relay: never listen on public interfaces. No web/API services.
logLevel: info
rtsp: true
rtspAddress: 127.0.0.1:8554
rtspTransports: [tcp]
rtmp: false
moq: false
hls: false
webrtc: false
srt: false
api: false
metrics: false
pprof: false
playback: false
authInternalUsers:
  - user: any
    ips: [127.0.0.1, "::1"]
    permissions:
      - action: publish
        path: pedestrians
      - action: read
        path: pedestrians
paths:
  pedestrians:
    source: publisher
