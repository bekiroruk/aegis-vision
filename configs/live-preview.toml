# Bounded browser demo; source URL remains a trusted server startup argument.
version = 1
[pipeline]
mode = "stream"
[detector]
backend = "yolo_onnx"
model = "../artifacts/models/yolov8n.onnx"
confidence_threshold = 0.35
[tracking]
backend = "two-stage"
iou_threshold = 0.30
max_missed_frames = 20
low_confidence = 0.10
new_track_confidence = 0.50
[stream]
duration_seconds = 180
open_timeout_ms = 8000
read_timeout_ms = 2000
max_outage_ms = 15000
max_frame_age_ms = 1000
tracking_gap_ms = 1000
queue_capacity = 1
