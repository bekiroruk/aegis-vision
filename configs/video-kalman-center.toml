# Experimental center-only motion gate; not a general accuracy guarantee.
# Full 4D Kalman correction and class/IoU matching stay unchanged.
version = 1

[pipeline]
mode = "video"

[detector]
backend = "yolo_onnx"
model = "../artifacts/models/yolov8n.onnx"
confidence_threshold = 0.35
nms_iou_threshold = 0.45
input_size = 640
max_detections = 300

[tracking]
backend = "kalman"
gating_mode = "center"
iou_threshold = 0.30
max_missed_frames = 20
low_confidence = 0.10
new_track_confidence = 0.50
# Omitted mahalanobis_gate uses nominal chi-square(2) 99% = 9.2103.

[runtime]
device = "cpu"
precision = "fp32"
engine = "opencv-dnn"
