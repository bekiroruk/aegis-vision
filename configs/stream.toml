# No camera URL/secrets in the repository. URL is supplied to the CLI.
version = 1
[pipeline]
mode = "stream"
[detector]
backend = "yolo_onnx"
model = "../artifacts/models/yolov8n.onnx"
confidence_threshold = 0.35
nms_iou_threshold = 0.45
input_size = 640
max_detections = 300
[tracking]
backend = "two-stage"
iou_threshold = 0.30
max_missed_frames = 20
low_confidence = 0.10
new_track_confidence = 0.50
[stream]
duration_seconds = 45
open_timeout_ms = 3000
read_timeout_ms = 2000
reconnect_initial_ms = 250
reconnect_max_ms = 2000
max_outage_ms = 15000
max_frame_age_ms = 1000
tracking_gap_ms = 1000
queue_capacity = 1
output_fps = 10.0
[runtime]
device = "cpu"
precision = "fp32"
engine = "opencv-dnn"
