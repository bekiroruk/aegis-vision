name: C++ CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DAEGISVISION_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  opencv-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenCV development libraries
        timeout-minutes: 15
        run: bash scripts/ci_install_opencv.sh
      - name: Configure image tools
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DAEGISVISION_WITH_OPENCV=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Real RTSP transport recovery (no model required)
        timeout-minutes: 2
        run: |
          curl -fL https://github.com/bluenviron/mediamtx/releases/download/v1.21.1/mediamtx_v1.21.1_linux_amd64.tar.gz -o /tmp/mediamtx.tgz
          echo '653abc672a3e693f8d3b2717752492fdcfb8072291ec108d03d3dd857411b0ee  /tmp/mediamtx.tgz' | sha256sum --check
          mkdir -p /tmp/aegis-mediamtx
          tar -xzf /tmp/mediamtx.tgz -C /tmp/aegis-mediamtx
          bash scripts/test_rtsp_transport.sh build /tmp/aegis-mediamtx/mediamtx

  search-linux:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.5
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - name: Install search dependencies
        timeout-minutes: 15
        run: |
          bash scripts/ci_install_opencv.sh libicu-dev
          curl -fL https://github.com/microsoft/onnxruntime/releases/download/v1.23.2/onnxruntime-linux-x64-1.23.2.tgz -o /tmp/ort.tgz
          echo '1fa4dcaef22f6f7d5cd81b28c2800414350c10116f5fdd46a2160082551c5f9b  /tmp/ort.tgz' | sha256sum --check
          tar -xzf /tmp/ort.tgz -C /tmp
          curl -fL https://huggingface.co/openai/clip-vit-base-patch32/resolve/3d74acf9a28c67741b2f4f2ea7635f0aaf6f0268/tokenizer.json -o /tmp/clip-tokenizer.json
      - name: Configure search tools
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DAEGISVISION_WITH_OPENCV=ON -DAEGISVISION_WITH_SEARCH=ON -DONNXRUNTIME_ROOT=/tmp/onnxruntime-linux-x64-1.23.2
      - name: Web media selection regression
        run: node tests/test_web_state.cjs
      - name: Quality dataset preparation tests (no downloads)
        run: python3 scripts/test_quality_data.py
      - name: Quality reference input tests (no downloads)
        run: python3 scripts/test_quality_reference.py
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test core and HTTP contract
        run: ctest --test-dir build --output-on-failure
      - name: Tokenizer golden references
        run: ./build/aegisvision_search_tests --tokenizer /tmp/clip-tokenizer.json tests/fixtures/clip_tokens.json
      - name: Qdrant upsert and query
        run: ./build/aegisvision_search_tests --qdrant-write 6333 aegis_ci
      - name: Restart Qdrant and verify persistence
        run: |
          docker restart ${{ job.services.qdrant.id }}
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:6333/readyz && break || sleep 1; done
          ./build/aegisvision_search_tests --qdrant-read 6333 aegis_ci

